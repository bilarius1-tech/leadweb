# vaybik.ru — статический сайт (leadweb). Не менять Traefik labels / compose.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json application/xml text/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Старые адреса → канонические
    location = /automation.html {
        return 301 /avtomatizaciya-1c/;
    }
    location = /bitrix.html {
        return 301 /bitrix/;
    }
    location = /kontakty {
        return 301 /o-nas/;
    }
    location = /kontakty/ {
        return 301 /o-nas/;
    }
    location ^~ /leadweb/ {
        rewrite ^/leadweb/(.*)$ /$1 permanent;
    }
    location = /leadweb {
        return 301 /;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Статика с длинным кешем (?v= на css/js)
    location ~* \.(?:css|js|mjs)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location ~* \.(?:woff2|woff|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # HTML и прочее — без кеша
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        add_header Cache-Control "no-cache" always;
        internal;
    }
}
